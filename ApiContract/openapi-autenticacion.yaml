openapi: 3.0.3
info:
  title: FloatOps API - Autenticacion
  description: >
    Login (RF-001), logout (RF-038) y rotacion de contrasena (RF-036)
    los maneja Keycloak directamente via sus propios endpoints OIDC
    (/realms/floatops/protocol/openid-connect/token, /logout, etc.) -
    Quarkus no los reimplementa. Este contrato solo cubre lo que la
    API propia expone: informacion del usuario autenticado.
  version: "0.1.0"

servers:
  - url: https://api.floatops.com/v1
    description: Produccion (conceptual, no confirmado)
  - url: http://localhost:8080/v1
    description: Desarrollo local (Quarkus dev mode)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Informacion del usuario autenticado

paths:
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Consultar usuario autenticado
      description: >
        Devuelve la identidad y el rol extraidos del token JWT emitido
        por Keycloak, para que el frontend sepa que mostrar segun la
        matriz de permisos (requerimientos seccion 2.1).
      tags: [auth]
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  nombre:
                    type: string
                  rol:
                    type: string
                    enum: [administrador, despachador, tecnico, supervisor-gerente, contador-facturacion]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
