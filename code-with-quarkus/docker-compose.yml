services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - sonardb
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      
  sonardb:
    image: postgres:16
    container_name: sonardb
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonardb_data:/var/lib/postgresql/data

  postgres:
    image: postgres:16
    container_name: floatops-postgres
    environment:
      POSTGRES_DB: floatops
      POSTGRES_USER: floatops
      POSTGRES_PASSWORD: floatops
    ports:
      - "5433:5432"
    volumes:
      - floatops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floatops"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: floatops-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      # 8081 en el host para no chocar con Quarkus dev mode, que tambien usa 8080
      - "8081:8080"
    volumes:
      - ./keycloak/floatops-realm.json:/opt/keycloak/data/import/floatops-realm.json:ro

  quarkus-api:
    # Monorepo: docker-compose.yml vive en la raiz, el proyecto Quarkus
    # esta en ./backend (renombrado de code-with-quarkus).
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: floatops-api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/floatops
      QUARKUS_DATASOURCE_USERNAME: floatops
      QUARKUS_DATASOURCE_PASSWORD: floatops
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/floatops
      QUARKUS_OIDC_CLIENT_ID: floatops-api
    ports:
      - "8080:8080"

volumes:
  floatops_pg_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonardb_data:
