services:
  postgres:
    image: postgres:16
    container_name: floatops-postgres
    environment:
      POSTGRES_DB: floatops
      POSTGRES_USER: floatops
      POSTGRES_PASSWORD: floatops
    ports:
      - "5433:5432"
    volumes:
      - floatops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floatops"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: floatops-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      # 8081 en el host para no chocar con Quarkus dev mode, que tambien usa 8080
      - "8081:8080"
    volumes:
      - ./keycloak/floatops-realm.json:/opt/keycloak/data/import/floatops-realm.json:ro

  quarkus-api:
    # docker-compose.yml vive junto al pom.xml del proyecto Quarkus (no en
    # la raiz del monorepo, y el proyecto no se renombro a ./backend), asi
    # que el build context es este mismo directorio.
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: floatops-api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/floatops
      QUARKUS_DATASOURCE_USERNAME: floatops
      QUARKUS_DATASOURCE_PASSWORD: floatops
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/floatops
      QUARKUS_OIDC_CLIENT_ID: floatops-api
      # Keycloak estampa el "iss" del token con el host/puerto que el
      # cliente uso para pedirlo. Cualquiera que pida un token desde fuera
      # de la red de Docker (navegador via Swagger UI, curl/Postman desde
      # el host) lo hace por localhost:8081, asi que el token trae
      # iss=http://localhost:8081/realms/floatops - pero por defecto la API
      # espera que coincida con QUARKUS_OIDC_AUTH_SERVER_URL de arriba
      # (keycloak:8080) y rechaza el token con "Issuer claim doesn't match".
      # Fijamos el issuer esperado al valor real que traen esos tokens.
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8081/realms/floatops
      # La config de S3 en application.properties esta bajo %dev (solo
      # aplica en quarkus:dev fuera de Docker), asi que este contenedor
      # (perfil prod) necesita la suya propia via variables de entorno -
      # mismo patron que el datasource y OIDC de arriba. "minio", no
      # localhost, porque este contenedor habla con el de al lado por la
      # red interna de docker-compose, no por los puertos mapeados al host.
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://minio:9000
      QUARKUS_S3_AWS_REGION: us-east-1
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: floatops
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: floatops123
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    container_name: floatops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: floatops
      MINIO_ROOT_PASSWORD: floatops123
      # Reduce la pre-asignacion de memoria de 1GiB a ~256MiB - ver
      # discusion de footprint antes de agregar esto.
      CI_CD: "true"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web (http://localhost:9001)
    volumes:
      - floatops_minio_data:/data

volumes:
  floatops_pg_data:
  floatops_minio_data: