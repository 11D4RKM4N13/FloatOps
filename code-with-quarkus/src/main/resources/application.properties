# Datasource - conecta al Postgres de docker-compose SOLO en modo dev.
# En modo test, al no haber jdbc.url configurado, Quarkus Dev Services
# levanta un Postgres desechable automaticamente (requiere Docker
# corriendo, pero NO nuestro docker-compose.yml - es un contenedor
# aparte que Quarkus crea y destruye solo por cada corrida de tests).
# OJO: localhost:5433, no postgres:5432 - esto corre FUERA de Docker
# (quarkus:dev en tu maquina), asi que usa el puerto mapeado al host,
# no el nombre de servicio interno de la red de Docker.
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=floatops
%dev.quarkus.datasource.password=floatops
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/floatops

# Flyway ejecuta V1__init.sql automaticamente al arrancar
quarkus.flyway.migrate-at-start=true

# Hibernate NO debe generar/alterar el esquema - eso es trabajo de Flyway.
# validate confirma que las entidades coinciden con lo que Flyway ya creo.
quarkus.hibernate-orm.database.generation=validate

# Log SQL util mientras desarrollas, apagalo mas adelante si es mucho ruido
quarkus.hibernate-orm.log.sql=true

# Swagger UI - por defecto solo aparece en dev/test, lo dejamos explicito
quarkus.swagger-ui.always-include=true

# OIDC - conecta contra el realm floatops en Keycloak.
# localhost:8081 porque, igual que Postgres, esto corre fuera de Docker
# (quarkus:dev en tu maquina) - el puerto mapeado al host, no el interno.
quarkus.oidc.auth-server-url=http://localhost:8081/realms/floatops
quarkus.oidc.client-id=floatops-api
quarkus.oidc.application-type=service
# Keycloak pone los roles del realm bajo realm_access.roles en el token -
# sin esto, @RolesAllowed nunca va a reconocer administrador/despachador/etc.
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Quarkus usa 8081 por defecto para el puerto HTTP de tests (@QuarkusTest),
# pero Keycloak (Docker) tambien esta mapeado a 8081 en el host - choque
# de puertos. Movemos el de tests a 8082 para que convivan.
quarkus.http.test-port=8082

# S3 (MinIO en dev/local, mismo codigo apuntaria a AWS S3 real en produccion)
%dev.quarkus.s3.endpoint-override=http://localhost:9000
%dev.quarkus.s3.aws.region=us-east-1
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=floatops
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=floatops123
# MinIO necesita path-style (http://host/bucket/key), no virtual-hosted
# style (http://bucket.host/key) que usa AWS S3 real por defecto.
%dev.quarkus.s3.path-style-access=true

%dev.quarkus.datasource.dev-ui.allow-sql=true
