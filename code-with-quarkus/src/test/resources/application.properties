# quarkus-jacoco por defecto ESCRIBE (no agrega) en target/jacoco-quarkus.exec
# al apagar la app de cada @QuarkusTest. reuse-data-file=true hace que agregue
# en vez de sobreescribir, para que el mismo archivo acumule tanto lo que
# instrumenta el javaagent del jacoco-maven-plugin (fuera de @QuarkusTest)
# como lo que instrumenta esta extension (dentro de @QuarkusTest). Ver pom.xml.
quarkus.jacoco.reuse-data-file=true
